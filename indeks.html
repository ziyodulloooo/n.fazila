<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fazila - Zamonaviy Kalkulyator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 15% 20%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-glow: rgba(139, 92, 246, 0.35);
      --op-bg: rgba(139, 92, 246, 0.18);
      --op-hover: rgba(139, 92, 246, 0.32);
      --op-text: #c4b5fd;
      --fn-bg: rgba(255, 255, 255, 0.06);
      --fn-hover: rgba(255, 255, 255, 0.12);
      --num-bg: rgba(255, 255, 255, 0.04);
      --num-hover: rgba(255, 255, 255, 0.1);
      --equals-bg: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --equals-glow: rgba(16, 185, 129, 0.4);
      --clear-bg: rgba(239, 68, 68, 0.15);
      --clear-hover: rgba(239, 68, 68, 0.25);
      --clear-text: #f87171;
    }

    [data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 15% 20%, #e0e7ff 0%, #f1f5f9 60%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --op-bg: rgba(99, 102, 241, 0.12);
      --op-hover: rgba(99, 102, 241, 0.22);
      --op-text: #4f46e5;
      --fn-bg: rgba(0, 0, 0, 0.04);
      --fn-hover: rgba(0, 0, 0, 0.08);
      --num-bg: rgba(255, 255, 255, 0.9);
      --num-hover: rgba(241, 245, 249, 1);
      --equals-bg: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --equals-glow: rgba(16, 185, 129, 0.3);
      --clear-bg: rgba(239, 68, 68, 0.12);
      --clear-hover: rgba(239, 68, 68, 0.2);
      --clear-text: #dc2626;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    /* Ambient background glows */
    .glow-sphere {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }
    .glow-1 {
      top: -100px;
      left: 10%;
      background: #8b5cf6;
    }
    .glow-2 {
      bottom: -100px;
      right: 15%;
      background: #06b6d4;
    }

    .calculator-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 
                  0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--fn-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--fn-hover);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    /* Screen / Display */
    .display-screen {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      min-height: 110px;
      position: relative;
    }

    [data-theme="light"] .display-screen {
      background: rgba(255, 255, 255, 0.6);
    }

    .formula-history {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--text-muted);
      min-height: 20px;
      word-break: break-all;
      text-align: right;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .main-result {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 40px;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-all;
      text-align: right;
      line-height: 1.1;
      width: 100%;
      letter-spacing: -0.5px;
    }

    /* Memory / Secondary Bar */
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .mem-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--op-bg);
      padding: 3px 8px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .mem-badge.active {
      opacity: 1;
    }

    .copy-btn {
      font-size: 12px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .copy-btn:hover {
      color: var(--text-main);
      background: var(--fn-bg);
    }

    /* Keypad Grid */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      border: 1px solid var(--card-border);
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 56px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      outline: none;
    }

    .btn:active {
      transform: scale(0.94);
    }

    .btn-num {
      background: var(--num-bg);
      color: var(--text-main);
    }
    .btn-num:hover {
      background: var(--num-hover);
    }

    .btn-op {
      background: var(--op-bg);
      color: var(--op-text);
      font-size: 20px;
    }
    .btn-op:hover {
      background: var(--op-hover);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-fn {
      background: var(--fn-bg);
      color: var(--text-muted);
      font-size: 15px;
    }
    .btn-fn:hover {
      background: var(--fn-hover);
      color: var(--text-main);
    }

    .btn-clear {
      background: var(--clear-bg);
      color: var(--clear-text);
      font-weight: 700;
    }
    .btn-clear:hover {
      background: var(--clear-hover);
    }

    .btn-equals {
      background: var(--equals-bg);
      color: white;
      font-size: 24px;
      box-shadow: 0 4px 15px var(--equals-glow);
    }
    .btn-equals:hover {
      filter: brightness(1.1);
      box-shadow: 0 6px 20px var(--equals-glow);
    }

    /* History Drawer */
    .history-drawer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      z-index: 50;
      padding: 24px;
      display: flex;
      flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .history-drawer.open {
      transform: translateY(0);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .history-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      text-align: right;
      transition: all 0.2s ease;
    }
    .history-item:hover {
      background: rgba(255, 255, 255, 0.09);
      transform: translateX(-3px);
    }

    .hist-calc {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .hist-res {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      margin-top: 60px;
      font-size: 14px;
    }

    .drawer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .drawer-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .drawer-clear {
      background: var(--clear-bg);
      color: var(--clear-text);
    }
    .drawer-close {
      background: var(--fn-bg);
      color: var(--text-main);
    }

    /* Toast notification */
    .toast {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      background: #10b981;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>

  <div class="calculator-container">
    <div id="toast" class="toast">Nusxa olindi!</div>

    <!-- Header -->
    <header class="header">
      <div class="brand-logo">
        <div class="brand-icon">✨</div>
        <span class="brand-name">FAZILA</span>
      </div>
      <div class="header-actions">
        <button id="soundToggle" class="icon-btn" title="Ovozni yoqish/o'chirish">🔊</button>
        <button id="historyToggle" class="icon-btn" title="Hisoblashlar tarixi">📜</button>
        <button id="themeToggle" class="icon-btn" title="Mavzuni o'zgartirish">🌙</button>
      </div>
    </header>

    <!-- Screen Display -->
    <div class="display-screen">
      <div id="formulaDisplay" class="formula-history"></div>
      <div id="resultDisplay" class="main-result">0</div>
    </div>

    <!-- Memory and Copy bar -->
    <div class="meta-bar">
      <span id="memBadge" class="mem-badge">M: 0</span>
      <button id="copyBtn" class="copy-btn">
        <span>📋</span> Nusxalash
      </button>
    </div>

    <!-- Keypad -->
    <div class="keypad-grid">
      <!-- Row 1: Advanced Functions -->
      <button class="btn btn-fn" data-action="sqrt">√</button>
      <button class="btn btn-fn" data-action="sqr">x²</button>
      <button class="btn btn-fn" data-action="recip">1/x</button>
      <button class="btn btn-fn" data-action="percent">%</button>

      <!-- Row 2: Clear & Divide -->
      <button class="btn btn-clear" data-action="clear">C</button>
      <button class="btn btn-clear" data-action="clear-entry">CE</button>
      <button class="btn btn-fn" data-action="backspace">⌫</button>
      <button class="btn btn-op" data-action="divide">÷</button>

      <!-- Row 3: 7, 8, 9, Multiply -->
      <button class="btn btn-num" data-num="7">7</button>
      <button class="btn btn-num" data-num="8">8</button>
      <button class="btn btn-num" data-num="9">9</button>
      <button class="btn btn-op" data-action="multiply">×</button>

      <!-- Row 4: 4, 5, 6, Subtract -->
      <button class="btn btn-num" data-num="4">4</button>
      <button class="btn btn-num" data-num="5">5</button>
      <button class="btn btn-num" data-num="6">6</button>
      <button class="btn btn-op" data-action="subtract">-</button>

      <!-- Row 5: 1, 2, 3, Add -->
      <button class="btn btn-num" data-num="1">1</button>
      <button class="btn btn-num" data-num="2">2</button>
      <button class="btn btn-num" data-num="3">3</button>
      <button class="btn btn-op" data-action="add">+</button>

      <!-- Row 6: Sign, 0, Dot, Equals -->
      <button class="btn btn-fn" data-action="sign">±</button>
      <button class="btn btn-num" data-num="0">0</button>
      <button class="btn btn-num" data-action="decimal">.</button>
      <button class="btn btn-equals" data-action="calculate">=</button>
    </div>

    <!-- History Drawer -->
    <div id="historyDrawer" class="history-drawer">
      <div class="history-header">
        <div class="history-title">📜 Hisob-kitoblar tarixi</div>
      </div>
      <div id="historyList" class="history-list">
        <div class="empty-state">Tarix hozircha bo'sh</div>
      </div>
      <div class="drawer-actions">
        <button id="clearHistoryBtn" class="drawer-btn drawer-clear">Tozalash</button>
        <button id="closeHistoryBtn" class="drawer-btn drawer-close">Yopish</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let currentInput = "0";
    let formula = "";
    let memoryVal = 0;
    let newNumber = true;
    let history = [];
    let soundEnabled = true;

    // Web Audio Synthesizer for tactile feedback
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playBeep(frequency = 520, type = 'sine', duration = 0.05) {
      if (!soundEnabled || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Elements
    const formulaDisplay = document.getElementById("formulaDisplay");
    const resultDisplay = document.getElementById("resultDisplay");
    const memBadge = document.getElementById("memBadge");
    const copyBtn = document.getElementById("copyBtn");
    const toast = document.getElementById("toast");
    const themeToggle = document.getElementById("themeToggle");
    const soundToggle = document.getElementById("soundToggle");
    const historyToggle = document.getElementById("historyToggle");
    const historyDrawer = document.getElementById("historyDrawer");
    const historyList = document.getElementById("historyList");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const closeHistoryBtn = document.getElementById("closeHistoryBtn");

    function updateDisplay() {
      let displayStr = currentInput;
      if (displayStr.length > 13) {
        let n = parseFloat(displayStr);
        if (!isNaN(n)) displayStr = n.toPrecision(8);
      }
      resultDisplay.textContent = displayStr;
      formulaDisplay.textContent = formula;
    }

    function inputDigit(digit) {
      playBeep(440, 'sine', 0.04);
      if (newNumber) {
        currentInput = digit;
        newNumber = false;
      } else {
        if (currentInput === "0") {
          currentInput = digit;
        } else if (currentInput.length < 15) {
          currentInput += digit;
        }
      }
      updateDisplay();
    }

    function inputDecimal() {
      playBeep(480, 'sine', 0.04);
      if (newNumber) {
        currentInput = "0.";
        newNumber = false;
      } else if (!currentInput.includes(".")) {
        currentInput += ".";
      }
      updateDisplay();
    }

    function toggleSign() {
      playBeep(380, 'sine', 0.04);
      if (currentInput !== "0") {
        currentInput = currentInput.startsWith("-") ? currentInput.slice(1) : "-" + currentInput;
        updateDisplay();
      }
    }

    function backspace() {
      playBeep(320, 'square', 0.04);
      if (!newNumber) {
        if (currentInput.length > 1) {
          currentInput = currentInput.slice(0, -1);
          if (currentInput === "-") currentInput = "0";
        } else {
          currentInput = "0";
          newNumber = true;
        }
        updateDisplay();
      }
    }

    function clearAll() {
      playBeep(300, 'triangle', 0.06);
      currentInput = "0";
      formula = "";
      newNumber = true;
      updateDisplay();
    }

    function clearEntry() {
      playBeep(300, 'triangle', 0.04);
      currentInput = "0";
      newNumber = true;
      updateDisplay();
    }

    function setOperator(symbol) {
      playBeep(580, 'sine', 0.05);
      if (formula && !newNumber) {
        calculate(true);
      }
      formula = `${currentInput} ${symbol}`;
      newNumber = true;
      updateDisplay();
    }

    function applyFunction(type) {
      playBeep(640, 'sine', 0.05);
      let val = parseFloat(currentInput);
      if (isNaN(val)) return;

      let res;
      if (type === "sqrt") {
        if (val < 0) {
          currentInput = "Xato";
          newNumber = true;
          updateDisplay();
          return;
        }
        res = Math.sqrt(val);
        formula = `√(${currentInput})`;
      } else if (type === "sqr") {
        res = Math.pow(val, 2);
        formula = `sqr(${currentInput})`;
      } else if (type === "recip") {
        if (val === 0) {
          currentInput = "Xato";
          newNumber = true;
          updateDisplay();
          return;
        }
        res = 1 / val;
        formula = `1/(${currentInput})`;
      } else if (type === "percent") {
        res = val / 100;
        formula = `${currentInput}%`;
      }

      currentInput = formatNumber(res);
      newNumber = true;
      updateDisplay();
    }

    function calculate(intermediate = false) {
      playBeep(700, 'sine', 0.08);
      if (!formula) return;

      const parts = formula.split(" ");
      if (parts.length >= 2) {
        const n1 = parseFloat(parts[0]);
        const op = parts[1];
        const n2 = parseFloat(currentInput);
        let res = null;

        if (op === "+") res = n1 + n2;
        else if (op === "-") res = n1 - n2;
        else if (op === "×") res = n1 * n2;
        else if (op === "÷") {
          if (n2 === 0) {
            currentInput = "0 ga bo'lish mumkin emas";
            formula = "";
            newNumber = true;
            updateDisplay();
            return;
          }
          res = n1 / n2;
        }

        if (res !== null) {
          const resStr = formatNumber(res);
          const fullExpr = `${parts[0]} ${op} ${currentInput}`;
          history.unshift({ expr: fullExpr, result: resStr });
          renderHistory();

          if (intermediate) {
            currentInput = resStr;
          } else {
            formula = `${fullExpr} =`;
            currentInput = resStr;
            newNumber = true;
          }
          updateDisplay();
        }
      }
    }

    function formatNumber(num) {
      if (!isFinite(num) || isNaN(num)) return "Xato";
      // Round floating point inaccuracies
      let rounded = parseFloat(num.toPrecision(12));
      return rounded.toString();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = `<div class="empty-state">Tarix hozircha bo'sh</div>`;
        return;
      }
      historyList.innerHTML = history.map((item, index) => `
        <div class="history-item" onclick="loadFromHistory('${item.result}')">
          <div class="hist-calc">${item.expr} =</div>
          <div class="hist-res">${item.result}</div>
        </div>
      `).join("");
    }

    window.loadFromHistory = function(val) {
      playBeep(500, 'sine', 0.04);
      currentInput = val;
      newNumber = true;
      updateDisplay();
      historyDrawer.classList.remove("open");
    };

    // Button interactions
    document.querySelectorAll(".btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const num = btn.dataset.num;
        const action = btn.dataset.action;

        if (num !== undefined) {
          inputDigit(num);
        } else if (action) {
          switch (action) {
            case "decimal": inputDecimal(); break;
            case "add": setOperator("+"); break;
            case "subtract": setOperator("-"); break;
            case "multiply": setOperator("×"); break;
            case "divide": setOperator("÷"); break;
            case "calculate": calculate(); break;
            case "clear": clearAll(); break;
            case "clear-entry": clearEntry(); break;
            case "backspace": backspace(); break;
            case "sign": toggleSign(); break;
            case "sqrt":
            case "sqr":
            case "recip":
            case "percent":
              applyFunction(action);
              break;
          }
        }
      });
    });

    // Copy action
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(currentInput).then(() => {
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
      });
    });

    // Theme toggle
    themeToggle.addEventListener("click", () => {
      const isLight = document.documentElement.getAttribute("data-theme") === "light";
      if (isLight) {
        document.documentElement.removeAttribute("data-theme");
        themeToggle.textContent = "🌙";
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        themeToggle.textContent = "☀️";
      }
    });

    // Sound toggle
    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? "🔊" : "🔇";
    });

    // History Drawer toggles
    historyToggle.addEventListener("click", () => historyDrawer.classList.toggle("open"));
    closeHistoryBtn.addEventListener("click", () => historyDrawer.classList.remove("open"));
    clearHistoryBtn.addEventListener("click", () => {
      history = [];
      renderHistory();
    });

    // Keyboard support
    window.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") inputDigit(e.key);
      else if (e.key === ".") inputDecimal();
      else if (e.key === "+") setOperator("+");
      else if (e.key === "-") setOperator("-");
      else if (e.key === "*") setOperator("×");
      else if (e.key === "/") { e.preventDefault(); setOperator("÷"); }
      else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); calculate(); }
      else if (e.key === "Backspace") backspace();
      else if (e.key === "Escape") clearAll();
      else if (e.key === "%") applyFunction("percent");
    });
  </script>
</body>
</html>
